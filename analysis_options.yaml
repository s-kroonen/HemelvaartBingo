# Static analysis rules for the Hemelvaart Bingo app.
# The reasoning behind these rules is in docs/conventions.md.
# Existing violations are cleaned up under HEM-51; new code must not add any.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - lib/firebase_options.dart
    - android/**
    - ios/**
    - web/**
  language:
    strict-raw-types: true
  errors:
    # A future returned without await inside try/catch skips the catch block.
    unawaited_return_in_try_block: error

linter:
  rules:
    always_declare_return_types: true
    avoid_print: true
    avoid_slow_async_io: true
    cancel_subscriptions: true
    directives_ordering: true
    prefer_final_fields: true
    prefer_final_locals: true
    prefer_single_quotes: true
    sort_child_properties_last: true
    unawaited_futures: true
    unnecessary_await_in_return: true
    use_build_context_synchronously: true
