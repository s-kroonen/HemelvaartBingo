<!DOCTYPE html>
<html>
<head>
    <!--
      If you are serving your web app in a path other than the root, change the
      href value below to reflect the base path you are serving from.

      The path provided below has to start and end with a slash "/" in order for
      it to work correctly.

      For more details:
      * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

      This is a placeholder for base href that will be replaced by the value of
      the `--base-href` argument provided to `flutter build`.
    -->
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="The bingo app of the vaart">

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="hemelvaartbingo">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png"/>

    <title>BingoVaart</title>
    <link rel="manifest" href="manifest.json">
</head>
<body>
<!-- This starts Flutter -->
<script src="flutter_bootstrap.js" async></script>

<!-- This handles our PWA Update Logic and SW Bridge -->
<script>
    let newWorker;

    // Listen for the Service Worker registration
    navigator.serviceWorker.getRegistration().then(reg => {
      if (!reg) return;

      reg.addEventListener('updatefound', () => {
        newWorker = reg.installing;
        newWorker.addEventListener('statechange', () => {
          if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
            // Tells Flutter a new version is ready in the background
            window.dispatchEvent(new CustomEvent('pwa_update_available'));
          }
        });
      });
    });

    // Listen for Flutter's "UPDATE NOW" button click
    window.addEventListener('pwa_activate_update', () => {
      if (newWorker) {
        newWorker.postMessage({ type: 'SKIP_WAITING' });
      }
    });

    // Reload the page once the new service worker has taken over
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      window.location.reload();
    });
</script>
</body>
</html>
