<!DOCTYPE html>
<html>
<head>
    <!--
      If you are serving your web app in a path other than the root, change the
      href value below to reflect the base path you are serving from.

      The path provided below has to start and end with a slash "/" in order for
      it to work correctly.

      For more details:
      * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

      This is a placeholder for base href that will be replaced by the value of
      the `--base-href` argument provided to `flutter build`.
    -->
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="The bingo app of the vaart">

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="hemelvaartbingo">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png"/>

    <title>BingoVaart</title>
    <link rel="manifest" href="manifest.json">
</head>
<body>
<script src="flutter_bootstrap.js" async></script>
<script>
    window.addEventListener('load', function() {
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerUrl: 'firebase-messaging-sw.js',
        }
      });
    });
</script>
<script>
    let newWorker;

    async function setupUpdateTracking() {
      // Wait for the service worker to be ready
      const registration = await navigator.serviceWorker.ready;

      // Check for updates every time the page is focused or loaded
      registration.update();

      const notifyFlutter = (worker) => {
        newWorker = worker;
        window.dispatchEvent(new CustomEvent('pwa_update_available'));
      };

      // 1. If there's already a worker waiting (user refreshed but didn't click update)
      if (registration.waiting) {
        notifyFlutter(registration.waiting);
      }

      // 2. Listen for new updates being found/installed
      registration.addEventListener('updatefound', () => {
        const installingWorker = registration.installing;
        installingWorker.addEventListener('statechange', () => {
          if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
            notifyFlutter(installingWorker);
          }
        });
      });
    }

    // 3. Listen for the "UPDATE NOW" command from Flutter
    window.addEventListener('pwa_activate_update', () => {
      if (newWorker) {
        newWorker.postMessage({ type: 'SKIP_WAITING' });
      }
    });

    // 4. Reload when the new worker takes control
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      window.location.reload();
    });

    setupUpdateTracking();
</script>
</body>
</html>
