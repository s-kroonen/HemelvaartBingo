<svg viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <g fill="currentColor" opacity="0.8">

        <!-- LEFT SIDE -->
        <!-- Confetti -->
        <circle cx="8" cy="20" r="1.5"/>
        <rect x="6" y="30" width="2" height="2" transform="rotate(45 7 31)" />
        <circle cx="10" cy="45" r="1"/>

        <!-- Garland -->
        <path d="M0,10 Q10,20 20,10" stroke="currentColor" fill="none" stroke-width="1"/>
        <circle cx="5" cy="15" r="1"/>
        <circle cx="10" cy="18" r="1"/>
        <circle cx="15" cy="15" r="1"/>

        <!-- RIGHT SIDE -->
        <!-- Confetti -->
        <circle cx="92" cy="20" r="1.5"/>
        <rect x="90" y="30" width="2" height="2" transform="rotate(45 91 31)" />
        <circle cx="88" cy="45" r="1"/>

        <!-- Party Lights -->
        <path d="M80,10 Q90,20 100,10" stroke="currentColor" fill="none" stroke-width="1"/>
        <circle cx="85" cy="15" r="1"/>
        <circle cx="90" cy="18" r="1"/>
        <circle cx="95" cy="15" r="1"/>

    </g>
</svg>