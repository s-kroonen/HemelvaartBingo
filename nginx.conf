server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 1. Disable caching for HTML and Service Worker
    # Kill cache for service worker so updates are detected immediately
    location ~* (service-worker\.js|flutter_service_worker\.js|firebase-messaging-sw\.js)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
        proxy_no_cache 1;
    }

    # 2. Cache-bust assets with hashes
    # Flutter main.dart.js and assets usually have hashes in filenames now
    location ~* \.(js|css|woff2|png|jpg|jpeg|svg|gif|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 3. Handle Flutter Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
}