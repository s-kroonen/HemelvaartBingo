name: Build & Deploy Flutter Web

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  # Every deploy runs the full CI first; the deploy only starts when it passes.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build-and-deploy:
    needs: [ci]
    runs-on: ubuntu-latest

    steps:
      # 🚀 Only runs if build succeeded
      - name: Trigger Portainer Webhook
        run: curl -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"

      - name: Wait for deployment
        run: sleep 30

      - name: Healthcheck
        run: |
          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.DEPLOY_HEALTHCHECK_URL }}")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Service is healthy"
              exit 0
            fi
            sleep 10
          done
          echo "❌ Service failed health check"
          exit 1